<!DOCTYPE html>
<html lang="es" class="qr-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>QR del tablero · WebLiga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: radial-gradient(circle at 50% 20%, #123a66 0%, #07111f 65%, #04080e 100%);
            color: #0f172a;
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .qr-card {
            width: min(92vw, 520px);
            padding: clamp(22px, 5vw, 42px);
            background: #ffffff;
            border: 1px solid #d8e0ea;
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .qr-kicker {
            color: #0066cc;
            font-size: clamp(11px, 2.4vw, 14px);
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .qr-card h1 {
            margin-top: 8px;
            font-family: 'Exo 2', sans-serif;
            font-size: clamp(24px, 5vw, 36px);
            line-height: 1.12;
            color: #0b1b33;
        }

        .qr-code {
            width: min(72vw, 360px);
            margin: clamp(18px, 4vw, 28px) auto clamp(12px, 3vw, 18px);
            padding: 10px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .qr-code svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .qr-url {
            color: #475569;
            font-size: clamp(11px, 2.5vw, 14px);
            line-height: 1.4;
            word-break: break-all;
        }

        .qr-hint {
            margin-top: 8px;
            color: #64748b;
            font-size: clamp(12px, 2.6vw, 15px);
        }

        .qr-print {
            margin-top: 22px;
            padding: 11px 22px;
            background: #0066cc;
            color: #ffffff;
            border: 0;
            border-radius: 9px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .qr-print:active {
            opacity: 0.8;
        }

        @media print {
            @page {
                margin: 12mm;
            }

            body {
                min-height: auto;
                padding: 0;
                background: #ffffff;
            }

            .qr-card {
                width: 100%;
                max-width: none;
                padding: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .qr-code {
                width: 105mm;
                max-width: 105mm;
                margin: 10mm auto;
                padding: 0;
                border: 0;
            }

            .qr-print {
                display: none;
            }

            .qr-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="qr-card">
        <p class="qr-kicker">WebLiga · Competencia de Robótica 2026</p>
        <h1>Escaneá para ver los horarios</h1>
        <div id="qrCode" class="qr-code" aria-label="Código QR para abrir el tablero de WebLiga"></div>
        <p class="qr-url" id="qrUrl">—</p>
        <p class="qr-hint">El cronograma se actualiza solo durante la competencia.</p>
        <button type="button" class="qr-print" id="printBtn">Imprimir</button>
    </main>

    <script src="supabase-config.js"></script>
    <script src="horarios-sync.js"></script>
    <script src="lib/qrcode-generator.js"></script>
    <script src="qr-comun.js"></script>
    <script src="qr.js"></script>
</body>
</html>
